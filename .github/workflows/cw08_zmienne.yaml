name: 08-04 Pogoda API — Variables

on:
  push:
    branches:
      - main
      - feature/06-pogoda-api
  pull_request:
    branches:
      - feature/06-pogoda-api
  workflow_dispatch:

env:
  WORKDIR: ${{ vars.WORKDIR }}
  DOCKERHUB_TAG: ${{ vars.DOCKERHUB_TAG }}
  DOCKER_PORT_EXTERNAL: ${{ vars.DOCKER_PORT_EXTERNAL }}
  DEPLOY_CONTAINER_NAME: ${{ vars.DEPLOY_CONTAINER_NAME }}
  WEATHER_CITY: ${{ vars.WEATHER_CITY }}

  TEST_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}
  HUB_IMAGE_BASE: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}

  CONFIG_SCOPE: workflow

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show workflow scope
        run: echo "CONFIG_SCOPE=$CONFIG_SCOPE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKDIR }}
          tags: ${{ env.TEST_IMAGE }}:${{ env.DOCKERHUB_TAG }}
          load: true
          push: false

      - name: Save image
        run: |
          docker save \
            "${{ env.TEST_IMAGE }}:${{ env.DOCKERHUB_TAG }}" \
            -o image.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pogoda-image
          path: image.tar

  test:
    runs-on: ubuntu-latest
    needs: build

    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pogoda-image

      - name: Load image
        run: docker load -i image.tar

      - name: Start container
        run: |
          docker run -d \
            --name pogoda_api_test \
            -p 8000:8000 \
            -e OPENWEATHER_API_KEY="$OPENWEATHER_API_KEY" \
            "${{ env.TEST_IMAGE }}:${{ env.DOCKERHUB_TAG }}"

      - name: Wait for startup
        run: sleep 10

      - name: Test weather endpoint
        run: |
          curl --fail \
            --get \
            --data-urlencode "city=$WEATHER_CITY" \
            "http://localhost:8000/weather"

      - name: Logs on failure
        if: failure()
        run: |
          docker logs pogoda_api_test || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f pogoda_api_test || true

  build-and-push:
    runs-on: ubuntu-latest
    needs: test

    if: >
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
      &&
      github.ref_name == vars.DEPLOY_BRANCH

    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKDIR }}
          push: true
          tags: |
            ${{ env.HUB_IMAGE_BASE }}:${{ env.DOCKERHUB_TAG }}
            ${{ env.HUB_IMAGE_BASE }}:${{ github.sha }}

  deploy:
    runs-on:
      - self-hosted
      - linux

    needs: build-and-push

    env:
      IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      CONFIG_SCOPE: job

    concurrency:
      group: pogoda-api-variables-deploy
      cancel-in-progress: false

    steps:

      - name: Scope from step
        env:
          CONFIG_SCOPE: step
        run: |
          echo "CONFIG_SCOPE=$CONFIG_SCOPE"

      - name: Scope from job
        run: |
          echo "CONFIG_SCOPE=$CONFIG_SCOPE"

      - name: Validate configuration
        run: |
          required=(
            "HUB_IMAGE_BASE"
            "DOCKERHUB_TAG"
            "DOCKER_PORT_EXTERNAL"
            "DEPLOY_CONTAINER_NAME"
            "WEATHER_CITY"
            "IMAGE_DIGEST"
          )

          for var in "${required[@]}"; do
            value="${!var}"

            if [ -z "$value" ]; then
              echo "Missing required variable: $var"
              exit 1
            fi
          done

      - name: Show configuration
        run: |
          echo "IMAGE=$HUB_IMAGE_BASE"
          echo "TAG=$DOCKERHUB_TAG"
          echo "PORT=$DOCKER_PORT_EXTERNAL"
          echo "CONTAINER=$DEPLOY_CONTAINER_NAME"
          echo "CITY=$WEATHER_CITY"

      - name: Build API_BASE_URL
        run: |
          echo "API_BASE_URL=http://127.0.0.1:${DOCKER_PORT_EXTERNAL}" >> $GITHUB_ENV

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull image by digest
        run: |
          docker pull "${HUB_IMAGE_BASE}@${IMAGE_DIGEST}"

      - name: Remove previous container
        run: |
          docker rm -f "$DEPLOY_CONTAINER_NAME" || true

      - name: Run deployed container
        run: |
          docker run -d \
            --restart unless-stopped \
            --name "$DEPLOY_CONTAINER_NAME" \
            -p "${DOCKER_PORT_EXTERNAL}:8000" \
            -e OPENWEATHER_API_KEY="$OPENWEATHER_API_KEY" \
            "${HUB_IMAGE_BASE}@${IMAGE_DIGEST}"

      - name: Wait for readiness
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 15 \
            --retry-delay 2 \
            --retry-connrefused \
            "${API_BASE_URL}/openapi.json"

      - name: Verify weather endpoint
        run: |
          curl --fail \
            --get \
            --data-urlencode "city=$WEATHER_CITY" \
            "${API_BASE_URL}/weather"

      - name: Verify container running
        run: |
          test "$(docker inspect --format '{{.State.Running}}' "$DEPLOY_CONTAINER_NAME")" = true

      - name: Show logs on failure
        if: failure()
        run: |
          docker logs "$DEPLOY_CONTAINER_NAME" || true