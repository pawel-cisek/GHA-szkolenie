name: 08-05 Pogoda API — Environments

on:
  push:
    branches:
      - main
      - feature/06-pogoda-api

  pull_request:
    branches:
      - main
      - feature/06-pogoda-api

  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  WORKDIR: ${{ vars.WORKDIR || './CWICZENIA/08-variables/pogoda_python_flusk' }}
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'pawelc' }}
  DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME || 'python_pogoda' }}

  TEST_IMAGE: ${{ vars.DOCKERHUB_USERNAME || 'piotrskoska' }}/${{ vars.DOCKER_IMAGE_NAME || 'python_pogoda' }}
  HUB_IMAGE_BASE: ${{ vars.DOCKERHUB_USERNAME || 'piotrskoska' }}/${{ vars.DOCKER_IMAGE_NAME || 'python_pogoda' }}

  WEATHER_CITY: ${{ vars.WEATHER_CITY || 'Warsaw' }}

  CI_TAG: ci-${{ github.sha }}

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKDIR }}
          tags: ${{ env.TEST_IMAGE }}:${{ env.CI_TAG }}
          load: true
          push: false

      - name: Save image
        run: |
          docker save "${TEST_IMAGE}:${CI_TAG}" -o image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: pogoda-environments-image
          path: image.tar

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pogoda-environments-image

      - name: Load image
        run: docker load -i image.tar

      - name: Run test container
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          test -n "$OPENWEATHER_API_KEY"

          docker run -d \
            --name pogoda_api_environments_ci \
            -p 127.0.0.1:8000:8000 \
            -e OPENWEATHER_API_KEY \
            "${TEST_IMAGE}:${CI_TAG}"

      - name: Wait for api
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 15 \
            --retry-all-errors \
            --retry-delay 2 \
            --retry-max-time 60 \
            --max-time 5 \
            --output /dev/null \
            http://127.0.0.1:8000/openapi.json

      - name: Test weather endpoint
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --get \
            --data-urlencode "city=$WEATHER_CITY" \
            http://127.0.0.1:8000/weather

      - name: Show logs
        if: failure()
        run: docker logs pogoda_api_environments_ci || true

      - name: Cleanup
        if: always()
        run: docker rm -f pogoda_api_environments_ci || true

  build-and-push-dev:
    runs-on: ubuntu-latest
    needs: test

    environment: dev

    concurrency:
      group: pogoda-env-publish-dev
      cancel-in-progress: false

    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == (vars.DEPLOY_BRANCH || 'main')

    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
      image_tag: ${{ steps.config.outputs.image_tag }}

    steps:
      - name: Read environment config
        id: config
        env:
          IMAGE_TAG_VALUE: ${{ vars.IMAGE_TAG }}
        run: |
          [ "$IMAGE_TAG_VALUE" = "devpiotrkoska" ] || exit 1

          echo "IMAGE_TAG=$IMAGE_TAG_VALUE" >> "$GITHUB_ENV"
          echo "image_tag=$IMAGE_TAG_VALUE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKDIR }}
          push: true
          tags: |
            ${{ env.HUB_IMAGE_BASE }}:${{ env.IMAGE_TAG }}
            ${{ env.HUB_IMAGE_BASE }}:${{ env.IMAGE_TAG }}-${{ github.sha }}

  build-and-push-test:
    runs-on: ubuntu-latest
    needs: test

    environment: test

    concurrency:
      group: pogoda-env-publish-test
      cancel-in-progress: false

    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == (vars.DEPLOY_BRANCH || 'main')

    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
      image_tag: ${{ steps.config.outputs.image_tag }}

    steps:
      - name: Read environment config
        id: config
        env:
          IMAGE_TAG_VALUE: ${{ vars.IMAGE_TAG }}
        run: |
          [ "$IMAGE_TAG_VALUE" = "testpiotrkoska" ] || exit 1

          echo "IMAGE_TAG=$IMAGE_TAG_VALUE" >> "$GITHUB_ENV"
          echo "image_tag=$IMAGE_TAG_VALUE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKDIR }}
          push: true
          tags: |
            ${{ env.HUB_IMAGE_BASE }}:${{ env.IMAGE_TAG }}
            ${{ env.HUB_IMAGE_BASE }}:${{ env.IMAGE_TAG }}-${{ github.sha }}

  build-and-push-prod:
    runs-on: ubuntu-latest
    needs: test

    environment: prod

    concurrency:
      group: pogoda-env-publish-prod
      cancel-in-progress: false

    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == (vars.DEPLOY_BRANCH || 'main')

    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
      image_tag: ${{ steps.config.outputs.image_tag }}

    steps:
      - name: Read environment config
        id: config
        env:
          IMAGE_TAG_VALUE: ${{ vars.IMAGE_TAG }}
        run: |
          [ "$IMAGE_TAG_VALUE" = "prodpiotrkoska" ] || exit 1

          echo "IMAGE_TAG=$IMAGE_TAG_VALUE" >> "$GITHUB_ENV"
          echo "image_tag=$IMAGE_TAG_VALUE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKDIR }}
          push: true
          tags: |
            ${{ env.HUB_IMAGE_BASE }}:${{ env.IMAGE_TAG }}
            ${{ env.HUB_IMAGE_BASE }}:${{ env.IMAGE_TAG }}-${{ github.sha }}

  deploy-dev:
    runs-on: [self-hosted, linux]
    environment: dev
    needs: build-and-push-dev

    concurrency:
      group: pogoda-env-deploy-dev
      cancel-in-progress: false

    env:
      TARGET_ENVIRONMENT: dev
      IMAGE_DIGEST: ${{ needs.build-and-push-dev.outputs.image_digest }}
      IMAGE_TAG: ${{ needs.build-and-push-dev.outputs.image_tag }}

  deploy-test:
    runs-on: [self-hosted, linux]
    environment: test
    needs: build-and-push-test

    concurrency:
      group: pogoda-env-deploy-test
      cancel-in-progress: false

    env:
      TARGET_ENVIRONMENT: test
      IMAGE_DIGEST: ${{ needs.build-and-push-test.outputs.image_digest }}
      IMAGE_TAG: ${{ needs.build-and-push-test.outputs.image_tag }}

  deploy-prod:
    runs-on: [self-hosted, linux]
    environment: prod
    needs: build-and-push-prod

    concurrency:
      group: pogoda-env-deploy-prod
      cancel-in-progress: false

    env:
      TARGET_ENVIRONMENT: prod
      IMAGE_DIGEST: ${{ needs.build-and-push-prod.outputs.image_digest }}
      IMAGE_TAG: ${{ needs.build-and-push-prod.outputs.image_tag }}